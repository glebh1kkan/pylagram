<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050b08" />
  <meta name="description" content="PylaGram Admin — Rust control center for the PylaGram MTProto server." />
  <title>PylaGram Admin — Control Center</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238df7b6'/%3E%3Cstop offset='1' stop-color='%2314b97f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M11 23V9h6a5 5 0 0 1 0 10h-3' fill='none' stroke='%23052218' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/new/fonts.css?v=6" />
  <link rel="stylesheet" href="/new/styles.css?v=6" />
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="aurora__orb aurora__orb--a"></span>
    <span class="aurora__orb aurora__orb--b"></span>
    <span class="aurora__orb aurora__orb--c"></span>
    <span class="aurora__grid"></span>
  </div>

  <div id="boot" class="boot" aria-hidden="true">
    <div class="boot__mark">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M11 23V9h6a5 5 0 0 1 0 10h-3" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
        <path d="M20.5 8.5c2.4 1.4 3.5 3.8 3.5 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".45" />
      </svg>
    </div>
    <div class="boot__name">PylaGram</div>
    <div class="boot__bar"><span></span></div>
  </div>

  <div id="app" class="app" hidden></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript">PylaGram Admin requires JavaScript to render the control center.</div>
  </noscript>

  <script src="/new/i18n.js?v=6"></script>
  <script src="/new/app.js?v=6"></script>
</body>
</html>
